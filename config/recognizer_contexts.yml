# PII Shield — Recognizer Context Configuration
#
# This file defines the context words used by each recognizer. Context words
# are terms that, when found near a potential PII match, boost the recognizer's
# confidence score. Edit this file to customize detection without code changes.
#
# Usage:
#   1. Set RECOGNIZER_CONTEXTS_FILE=config/recognizer_contexts.yml in .env
#   2. Edit the entries below to add/remove context words
#   3. Restart the service
#
# Two modes per recognizer:
#   context:         Sets the recognizer's context word list
#   context_append:  Adds words on top of what's defined in context (or code defaults)
#
# Keys must match Presidio recognizer class names (case-sensitive).

