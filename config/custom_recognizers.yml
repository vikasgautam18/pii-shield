# PII Shield — Custom Regex-Based Recognizers
#
# Define new PII entity types using regex patterns without writing code.
# Uses Presidio's native PatternRecognizer format.
#
# Each recognizer needs:
#   name:              Human-readable name (used in logs and registry)
#   supported_entity:  Entity type label (e.g., IN_IFSC)
#   patterns:          List of {name, regex, score} objects
#   context:           Optional context words that boost detection confidence
#
# Usage:
#   1. Add recognizer entries below
#   2. Set CUSTOM_RECOGNIZERS_FILE=config/custom_recognizers.yml in .env (or use default)
#   3. Restart the service
#
# Regex escaping: YAML requires double-backslash for regex (\\b, \\d, etc.)

# Global allow-list: terms that should never be anonymized.
# Common acronyms and labels that NER models misclassify as entities.
global_allow_list:
  - IFSC
  - ifsc
  - Ifsc
  - NEFT
  - RTGS
  - IMPS
  - UPI
  - NACH
  - ECS
  - KYC
  - NRE
  - NRO
  - NRI
  - EMI
  - DOB
  - STR
  - SWIFT
  - swift
  - BIC
  - bic
  - SSN
  - ITIN
  - GPS
  - gps
  - Gps
  # Business-segment acronyms — market categories, not named organisations
  - SME
  - SMEs
  - MSME
  - MSMEs
  - CKYC
  - ckyc
  - CERSAI
  - KIN
  - PRAN
  - pran
  - NPS
  - PFRDA
  - CRA
  - APAAR
  - apaar
  - ABC
  - PEN
  - DigiLocker
  - Student APAAR
  - US
  - OTP
  - CIF
  - cif
  - CustID
  - Aadhaar
  - aadhaar
  - AADHAAR
  - Aadhar
  - aadhar
  - PAN
  - pan

recognizers:

  - name: "InIfscRecognizer"
    supported_entity: "IN_IFSC"
    supported_language: "en"
    patterns:
      # Standard IFSC code: 4 letters + 0 + 6 alphanumeric chars
      # Case-insensitive via (?i) flag
      # Examples: SBIN0001234, hdfc0002345, Icic0001234
      - name: "ifsc_standard"
        regex: "(?i)\\b[A-Z]{4}0[A-Z0-9]{6}\\b"
        score: 0.85
    context:
      - ifsc
      - neft
      - rtgs
      - imps
      - branch
      - bank

  - name: "SwiftBicRecognizer"
    supported_entity: "SWIFT_CODE"
    supported_language: "en"
    # Case-sensitive: SWIFT codes are always uppercase (24 = regex.M|S, no regex.I)
    global_regex_flags: 24
    patterns:
      # 11-char SWIFT/BIC: 4 letters (bank) + 2 letters (country) + 2 alphanum (location) + 3 alphanum (branch)
      # Examples: DEUTDEFF500, SBININBB104, HDFCINBBXXX
      - name: "swift_bic_11"
        regex: "\\b[A-Z]{6}[A-Z0-9]{2}[A-Z0-9]{3}\\b"
        score: 0.40
      # 8-char SWIFT/BIC (head office): 4 letters + 2 letters + 2 alphanum
      # Examples: DEUTDEFF, HDFCINBB, SBININBB
      - name: "swift_bic_8"
        regex: "\\b[A-Z]{6}[A-Z0-9]{2}\\b"
        score: 0.30
    context:
      - swift
      - bic
      - wire
      - correspondent
      - intermediary
      - nostro
      - vostro
      - remittance
